name: Remedy keeper

# Drives Remedy's permissionless calls so claims move without anyone pressing a
# button: reviews unreviewed claims, settles reviewed ones, checks submitted fix
# artifacts, and releases escrow once a fix is verified. The contracts decide
# every outcome and amount; the keeper holds no privileges and no funds.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only, send nothing"
        type: boolean
        default: false

permissions:
  contents: read

# one keeper at a time, so two runs never act on the same claim
concurrency:
  group: remedy-keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: keeper/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Plan tests
        run: npm test

      # revert counts carry over between runs so a claim that keeps failing is skipped
      - name: Restore keeper state
        uses: actions/cache/restore@v4
        with:
          path: keeper/.keeper-state.json
          key: keeper-state-${{ github.run_id }}
          restore-keys: keeper-state-

      - name: Ensure a state file exists
        run: test -f .keeper-state.json || echo '{"failures":{}}' > .keeper-state.json

      - name: Run keeper
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
        run: node keeper.mjs

      - name: Save keeper state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: keeper/.keeper-state.json
          key: keeper-state-${{ github.run_id }}
